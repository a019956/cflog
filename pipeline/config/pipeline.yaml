# Pipeline config (02 Architecture). Loaded and validated by src/config.ts.
overture:
  # Pinned release. The 2026-09-23.0 release replaced `categories` with `taxonomy` + `basic_category`.
  # Check category ids with: npm run pipeline -- --inspect-categories --city boston
  release: '2026-09-23.0'
  # {release} is substituted. Tests and local runs can point this at a local Parquet file.
  source: 's3://overturemaps-us-west-2/release/{release}/theme=places/type=place/*'
  primaryCategories: [coffee_shop, coffee_roastery, cafe]
  alternateCategories: [coffee_shop, coffee_roastery]
  roasterCategories: [coffee_roastery]
  minConfidence: 0.5
discover:
  dedupeMeters: 50
  multiLocationThreshold: 5
crawler:
  userAgent: 'CoffeeLogBot/0.1 (+${CRAWLER_CONTACT_URL})'
  minIntervalMsPerHost: 2000
  hostConcurrency: 8
  maxPagesPerSite: 6
  timeoutMs: 15000
  retries: 2
limits:
  maxBeansPerCafe: 200
  maxMenuItemsPerCafe: 150
