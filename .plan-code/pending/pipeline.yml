name: Weekly data pipeline
on:
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC (ADR-003)
  workflow_dispatch:
    inputs:
      city:
        description: 'One city (nyc, philadelphia, boston) or empty for all'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (no Firestore writes)'
        type: boolean
        default: false
      max_cafes:
        description: 'Limit cafés per city (partial run; vanished cafés are not hidden)'
        required: false
        default: ''

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      # Sequential so Gemini's per-minute limit and Firestore's daily write quota are shared safely.
      max-parallel: 1
      fail-fast: false
      matrix:
        city: [nyc, philadelphia, boston]
    steps:
      - name: Skip cities not selected
        id: sel
        env:
          INPUT_CITY: ${{ github.event.inputs.city }}
          MATRIX_CITY: ${{ matrix.city }}
        run: |
          if [ -n "$INPUT_CITY" ] && [ "$INPUT_CITY" != "$MATRIX_CITY" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.sel.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.sel.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.sel.outputs.skip != 'true'
      - name: Run pipeline
        if: steps.sel.outputs.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_RPM: ${{ vars.GEMINI_RPM || '10' }}
          GEMINI_MAX_CALLS: ${{ vars.GEMINI_MAX_CALLS || '300' }}
          PIPELINE_MAX_WRITES: ${{ vars.PIPELINE_MAX_WRITES || '6000' }}
          CRAWLER_CONTACT_URL: ${{ vars.CRAWLER_CONTACT_URL || 'https://github.com/a019956/cflog#bot' }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          # Inputs go through env (never interpolated into the script) and are validated.
          MATRIX_CITY: ${{ matrix.city }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_MAX_CAFES: ${{ github.event.inputs.max_cafes }}
        run: |
          ARGS=(--city "$MATRIX_CITY")
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          if [ -n "$INPUT_MAX_CAFES" ]; then
            if ! [[ "$INPUT_MAX_CAFES" =~ ^[0-9]+$ ]]; then echo "max_cafes must be a number" >&2; exit 2; fi
            ARGS+=(--max-cafes "$INPUT_MAX_CAFES")
          fi
          npm run pipeline -- "${ARGS[@]}"
      - name: Upload report
        if: always() && steps.sel.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report-${{ matrix.city }}
          path: pipeline/out/
          if-no-files-found: ignore
          retention-days: 30
